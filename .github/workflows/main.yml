name: Build Remote 3 Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Integration Package
        run: |
          # Create a clean target directory
          mkdir -p build_output
          
          # Target only the essential integration files, leaving out GitHub noise
          tar -czf build_output/uc-intg-hubitat-tbwa.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build_output' \
            .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hubitat-integration-package
          path: build_output/uc-intg-hubitat-tbwa.tar.gz
