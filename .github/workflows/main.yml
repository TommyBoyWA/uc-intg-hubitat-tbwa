name: Build Remote 3 Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom fork code
        uses: actions/checkout@v4

      - name: Fetch and Merge Original Master Repository Source
        run: |
          mkdir -p master_src
          curl -L https://github.com | tar -xzf - -C master_src --strip-components=1
          cp -rf . master_src/

      - name: Compile and Bundle via PyInstaller Container
        run: |
          mkdir -p build_output
          docker run --rm \
            -v "$PWD/master_src":/workspace \
            docker.io/unfoldedcircle/r2-pyinstaller:3.11.6-0.2.0 \
            bash -c "cd /workspace && python -m pip install -r requirements.txt && pyinstaller --clean --onedir --name intg-hubitat main.py"
          
          cd master_src
          tar -czf ../build_output/uc-intg-hubitat-tbwa.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build_output' \
            --exclude='master_src' \
            .

      - name: Upload Completed 30MB Custom Package
        uses: actions/upload-artifact@v4
        with:
          name: hubitat-integration-package
          path: build_output/uc-intg-hubitat-tbwa.tar.gz
