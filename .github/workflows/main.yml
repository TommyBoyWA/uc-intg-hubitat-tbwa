name: Build Remote 3 Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your custom code
        uses: actions/checkout@v4

      - name: Inject Code into Original Release Bundle
        run: |
          mkdir -p build_output
          
          # 1. Download the original developer's 30MB compiled engine package
          wget https://github.com
          
          # 2. Extract it into a working directory
          mkdir unpacked_core
          tar -xzf uc-intg-hubitat-tbwa.tar.gz -C unpacked_core/
          
          # 3. Copy your modified files over the old files inside the engine
          # This swaps your code changes directly into the heavy package
          cp -rf . unpacked_core/
          
          # 4. Repackage everything back into a clean .tar.gz bundle
          cd unpacked_core
          tar -czf ../build_output/uc-intg-hubitat-tbwa.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='uc-intg-hubitat-tbwa.tar.gz' \
            --exclude='unpacked_core' \
            --exclude='build_output' \
            .

      - name: Upload Complete 30MB Package
        uses: actions/upload-artifact@v4
        with:
          name: hubitat-integration-package
          path: build_output/uc-intg-hubitat-tbwa.tar.gz
