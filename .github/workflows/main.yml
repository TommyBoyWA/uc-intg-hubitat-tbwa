name: Build Remote 3 Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your custom code
        uses: actions/checkout@v4

      - name: Bundle Driver Payload
        run: |
          mkdir -p build_output
          
          # This compiles your changed source scripts identically 
          # to how the master integration architecture formats bundles.
          tar -czf build_output/uc-intg-hubitat-tbwa.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build_output' \
            .

      - name: Upload Clean Package
        uses: actions/upload-artifact@v4
        with:
          name: hubitat-integration-package
          path: build_output/uc-intg-hubitat-tbwa.tar.gz
